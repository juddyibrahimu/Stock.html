<!DOCTYPE html>
<html>

<head>

    <title> Inventory_Management </title>
    <link rel="stylesheet" href="{{url_for('static', filename='Style.css')}}">
<script src="https://kit.fontawesome.com/a68def8041.js" crossorigin="anonymous"></script>

</head>

<body>
    <header class="header">
        <h1><i class="fa-solid fa-crown fa-fade" style="color: rgb(234, 206, 101);"></i>  Inventory_Management System 
 <i class="fa-solid fa-crown fa-fade" style="color: rgb(234, 206, 101);"></i></h1>
        <p>Welcome to Inventory_Management System<br>Keep your record for future!</p>
    </header>
    <nav>
       <a href="/More product.html">More products </a>
        <a href="/About.html">About</a>
         <a href="/Contact.html">Contact</a>
    </nav> 

<div class="search"><h2>Search product</h2>

        <form action="/search_product" method="GET">
        <input name="ProductName" type="search" placeholder="Enter product name">
        <button type="submit"><i class="fa-brands fa-sistrix fa-xs" style="color: rgb(220, 175, 12);"></i> Search</button></form></div>
     
    <div class="add"><h2>Add product</h2>
    <form action="/products" method="POST">
        <input name="ProductName" placeholder="Product name" required>
        <input name="Brand" type="text" placeholder="fill Brand name">
        <input name="Category" type="text" placeholder="Category name">
        <input name="Quality" type="text" placeholder="Quality of product">
        <input name="Price" type="number" step="0.01" placeholder="Price" required>
        <input name="Quantity" type="number" placeholder="Quantity required">
        <button type="submit"><i class="fa-solid fa-plus" style="color: rgb(220, 175, 12);"></i>Add Product</button>
    </form></div>


    <div class="section"><div class="sell"><h2>Sell products</h2>
    <form action="/sales" method="POST">
        <input name="ProductName" placeholder="Product name" required>
        <input name="Quantity" type="number" placeholder="Quantity sold" required>
        <button type="submit"><i class="fa-solid fa-cart-arrow-down fa-xs" style="color: rgb(220, 175, 12);"></i> Sell Product</button>
    </form></div>

    <div class="update"><h2>Update product</h2>
    <form action="/update_product" method="POST">
        <input type="number" name="product_id" placeholder="product id to update" required>
        <input name="name" placeholder="new name" required>
        <input type="number" name="price" placeholder="new price" required>
        <input type="number" name="quantity" step="0.01" placeholder="new quantity" required>
        <button type="submit"><i class="fa-solid fa-pen-to-square fa-xs" style="color: rgb(220, 175, 12);"></i> Update product</button>
    </form></div>

    <div class="delete"><h2>Delete product</h2>
    <form action="/delete_product" method="POST">
        <input type="number" name="product_id" placeholder="product id to delete" required>
        <input name="name" placeholder="name" required>
        <button type="submit"><i class="fa-solid fa-trash-can fa-xs" style="color: rgb(220, 175, 12);"></i>  Delete</button>
    </form></div>
    </div>

    <div class="reports"><h2>Reports</h2>
    <button>
        <p><a href="/products"> View all products</a></p>
    </button>
    <button>
        <p><a href="/stock_value">Total Stock Value</a></p>
    </button>
    <button>
        <p><a href="/low_stock"> Low Stock Items</a></p>
    </button>
    </div>
</body>



</html>
