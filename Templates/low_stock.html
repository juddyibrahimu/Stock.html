<!DOCTYPE html>
<html>
    <head><title>low low_stock</title>
     <link rel="stylesheet" href="{{url_for('static', filename='Style.css')}}">
    <style>
        table{
            border-collapse: collapse;
            width: 90%;
            margin: 20 auto;
            background: wheat;
        }
        th,td{
            padding: 10px;
            border: 2px solid rgb(246, 55, 55);
            text-align: left;
        }
            th{
            background: maroon;
            color: rgb(240, 177, 211);
        }
        body{
          margin: 3rem;
        }
    </style>
</head>

     <body><h1>Low Stock Product</h1>
     <table><tr><th>ID</th><th>Name</th><th>Brand</th><th>Category</th><th>Quality</th><th>Price</th><th>Quantity</th></tr>
    {% for p in products %}
        <tr class="{{ 'low' if p.Quantity < 10}}">
            <td>{{p.ProductID}}</td>
            <td>{{p.ProductName|trim}}</td>
          <td>{{p.Brand}}</td>
            <td>{{p.Category}}</td>
            <td>{{p.Quality}}</td>
            <td>{{"{:,.0f}".format(p.Price)}}</td>
            <td>{{p.Quantity}}</td>
        </tr>
        {%endfor%}</table>
    </body>
</html>
