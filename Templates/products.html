<!DOCTYPE html>
<html>
    <head><title>PRODUCTS</title>
    <link rel="stylesheet" href="{{url_for('static', filename='Style.css')}}">
    <style>
        table{
            border-collapse: collapse;
            width: 90%;
            margin: 20px auto;
            background: wheat;
        }
        th,td{
            padding: 10px;
            border: 1px solid rgb(240, 73, 73);
            text-align: left;

            }
        th{
            background: maroon;
            color: rgb(240, 177, 211);
        }
        tr.low td{
            background: rgb(245, 112, 112);
        }
        </style></head>
    <body>
        <h1>All products</h1>
    <table><tr><th>ID</th>
        <th>Name</th>
        <th>Brands</th>
        <th>Category</th>
         <th>Quality</th>
          <th>Price</th>
           <th>Quantity</th>
        {% for p in products %}
        <tr class="{{ 'low' if p.Quantity|int <= 5}}">
            <td>{{p.ProductID}}</td>
            <td>{{p.ProductName|trim}}</td>
            <td>{{p.Brand|trim}}</td>
            <td>{{p.Category|trim}}</td>
            <td>{{p.Quality|trim}}</td>
            <td>{{"{:,.0f}".format(p.Price|float)}}</td>
            <td>{{p.Quantity}}</td>
        </tr>
        {%endfor%}
    </table>
<button><a href="download_pdf">download_pdf</a></button>
<button><a href="download_excel">download_excel</a></button>

    <p style="text-align: center;"><a href="/"><button>Back.</button></a></p>
    </body>
</html>
