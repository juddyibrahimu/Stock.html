<!DOCTYPE html>
<html>

<head>

    <title> Inventory_Management </title>
    <link rel="stylesheet" href="{{url_for('static', filename='Style.css')}}">

</head>

<body>
    <header>
        <h1>Inventory_Management System</h1>
        <p>Welcome to Inventory_Management System</p>
    </header>

<h2>Search product</h2>
        <form action="/show_product" method="GET">
        <input name="name" type="search" placeholder="Enter product name">
        <button type="submit">Search</button></form>
     
    <h2>Add product</h2>
    <form action="/products" method="POST">
        <input name="name" placeholder="Product name" required>
        <input name="price" type="number" step="0.01" placeholder="Price" required>
        <input name="quantity" type="number" placeholder="Quantity required">
        <button type="submit">Add Product</button>
    </form>


    <h2>Sell products</h2>
    <form action="/sales" method="POST">
        <input name="name" placeholder="Product name" required>
        <input name="quantity" type="number" placeholder="Quantity sold" required>
        <button type="submit">Sell Product</button>
    </form>
    <h2>Update product</h2>
    <form action="/update_product" method="POST">
        <input type="number" name="product_id" placeholder="product id to update" required>
        <input name="name" placeholder="new name" required>
        <input type="number" name="price" placeholder="new price" required>
        <input type="number" name="quantity" step="0.01" placeholder="new quantity" required>
         <input name="product_id" placeholder="id" required>
        <input name="name" placeholder="new name" required>
        <input name="price" placeholder="new price" required>
        <input name="quantity" placeholder="new quantity" required>
        <button type="submit">Add new quantity</button>
    </form>
    <h2>DELETE PRODUCT</h2>
    <form action="/delete_product" method="POST">
        <input type="number" name="product_id" placeholder="product id to delete" required>
        <input type="number" name="product_id" placeholder="product_id" required>
        <input name="name" placeholder="name" required>
        <button type="submit">DELETE</button>
    </form>


    <h2>Reports</h2>
    <button>
        <p><a href="/products"> View all products</a></p>
    </button>
    <button>
        <p><a href="/stock_value">Total Stock Value</a></p>
    </button>
    <button>
        <p><a href="/low_stock"> Low Stock Items</a></p>
    </button>
</body>



</html>
